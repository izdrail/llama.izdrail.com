name: llama

services:
  llama-cpp:
    build:
      context: .
    image: izdrail/llama.izdrail.com:latest
    container_name: llama-cpp
    expose:
      - "8080"
    environment:
      LLAMA_ARG_MODELS_DIR: "${LLAMA_ARG_MODELS_DIR:-/models}"
      LLAMA_ARG_MODELS_MAX: "${LLAMA_ARG_MODELS_MAX:-1}"
      LLAMA_CPP_CONTEXT_SIZE: "${LLAMA_CPP_CONTEXT_SIZE:-4096}"
      LLAMA_CPP_SLEEP_IDLE_SECONDS: "${LLAMA_CPP_SLEEP_IDLE_SECONDS:-60}"
      LLAMA_CPP_GPU_LAYERS: "${LLAMA_CPP_GPU_LAYERS:-}"
      LLAMA_ARG_API_KEY: "${LLAMA_ARG_API_KEY:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      # Persistent host path: GGUFs survive container restarts/rebuilds.
      # Populated by hardlinks into the Ollama blob store (zero extra disk).
      - /root/llama-models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
