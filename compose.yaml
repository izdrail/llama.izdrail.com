name: llama

services:
  llama-cpp:
    build:
      context: .
    image: izdrail/llama.izdrail.com:latest
    container_name: llama-cpp
    expose:
      - "8080"
    environment:
      LLAMA_CPP_HF_REPO: "${LLAMA_CPP_HF_REPO:-unsloth/Qwen3-4B-GGUF}"
      LLAMA_CPP_HF_FILE: "${LLAMA_CPP_HF_FILE:-Qwen3-4B-Q4_K_M.gguf}"
      LLAMA_CPP_MODEL_ALIAS: "${LLAMA_CPP_MODEL_ALIAS:-qwen3-4b}"
      LLAMA_CPP_CONTEXT_SIZE: "${LLAMA_CPP_CONTEXT_SIZE:-4096}"
      LLAMA_CPP_SLEEP_IDLE_SECONDS: "${LLAMA_CPP_SLEEP_IDLE_SECONDS:-60}"
      LLAMA_CPP_GPU_LAYERS: "${LLAMA_CPP_GPU_LAYERS:-999}"
      LLAMA_ARG_API_KEY: "${LLAMA_ARG_API_KEY:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - llama-cpp-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  llama-cpp-cache:
